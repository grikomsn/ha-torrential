name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck
        run: shellcheck -s sh torrential/rootfs/ha/*.sh .github/scripts/*.sh
      - name: YAML
        run: >-
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}'
          repository.yaml torrential/config.yaml torrential/translations/ .github/

  version:
    name: Version and changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install checker dependencies
        # awesomeversion is pinned to the version Home Assistant's Supervisor
        # uses to decide whether an update is newer.
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet awesomeversion==25.8.0 PyYAML==6.0.4
      - name: Check version
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            /tmp/venv/bin/python .github/scripts/check_version.py
          else
            /tmp/venv/bin/python .github/scripts/check_version.py --base "$base"
          fi

  build:
    runs-on: ubuntu-latest
    needs: [lint, version]
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ${{ matrix.platform }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: torrential
          platforms: ${{ matrix.platform }}
          push: false
          load: ${{ matrix.platform == 'linux/amd64' }}
          tags: ha-torrential:ci
      - name: Smoke test
        if: matrix.platform == 'linux/amd64'
        run: .github/scripts/smoke_test.sh ha-torrential:ci
