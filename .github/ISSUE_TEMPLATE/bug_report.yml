name: Bug report
description: Something in the Home Assistant app doesn't work.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Remove secrets before posting: pairing codes and links, tunnel token,
        Tailscale auth key and login URLs, indexer API keys and your hostnames.
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: "0.7.0"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware and Home Assistant OS version
      placeholder: Home Assistant Green, OS 17.0
    validations:
      required: true
  - type: checkboxes
    id: exposure
    attributes:
      label: How you reach torrential
      options:
        - label: Home network only (port 47919)
        - label: Built-in Cloudflare Tunnel
        - label: Built-in Tailscale, plain HTTP on the tailnet
        - label: Built-in Tailscale Serve (HTTPS)
        - label: Built-in Tailscale Funnel
        - label: The Tailscale app, the Cloudflared app or another proxy
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: App log
      description: From the app's Log tab.
      render: text
